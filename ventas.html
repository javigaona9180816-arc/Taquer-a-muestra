<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>VENTAS</title>
<style>body{background:#111;color:#fff;font-family:Arial;padding:12px;text-align:center}h1{color:#ffcc00}.card{background:#222;padding:15px;border-radius:12px;margin:10px auto;max-width:400px}</style></head><body>
<h1>💰 VENTAS HOY</h1><div class="card"><h2 id="total">$0</h2><p id="num">0 órdenes</p><p id="prom">Ticket: $0</p></div><div id="detalle"></div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import { getFirestore, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";
const firebaseConfig = { apiKey: "AIzaSyAJG7IjvvALqEglWyxYeeAadbG0yYBDEL0", authDomain: "taqueria-40c71.firebaseapp.com", projectId: "taqueria-40c71", storageBucket: "taqueria-40c71.firebasestorage.app", messagingSenderId: "536022224393", appId: "1:536022224393:web:91c205d366d4060736b2d8", measurementId: "G-X59B32XMQV" };
const app = initializeApp(firebaseConfig); const db = getFirestore(app);
onSnapshot(collection(db,"ordenes"),(snap)=>{
 let hoy=new Date().toDateString(); let filtradas=[]; snap.forEach(d=>{let o=d.data(); if(new Date(o.fecha).toDateString()==hoy) filtradas.push(o);});
 let total=filtradas.reduce((a,b)=>a+b.total,0);
 document.getElementById('total').innerText='$'+total;
 document.getElementById('num').innerText=filtradas.length+' órdenes hoy';
 document.getElementById('prom').innerText='Ticket: $'+(filtradas.length?Math.round(total/filtradas.length):0);
 document.getElementById('detalle').innerHTML=filtradas.map(o=>`<div class="card" style="text-align:left"><b>#${o.folio} ${o.nombre}</b> - $${o.total} - ${o.modo}</div>`).join('');
});
</script></body></html>
