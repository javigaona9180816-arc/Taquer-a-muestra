<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ventas</title><style>body{font-family:system-ui;background:#111;color:#fff;padding:12px}.card{background:#222;border-radius:10px;padding:10px;margin:8px 0;display:flex;justify-content:space-between}.total{background:#00e676;color:#000;padding:18px;border-radius:12px;font-size:22px;font-weight:bold;text-align:center}</style></head><body><h1>💰 VENTAS</h1><div id="estado" style="background:#333;padding:8px;border-radius:8px">Conectando...</div><div class="total" id="total">$0</div><div id="lista"></div><script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getFirestore,collection,onSnapshot,query,orderBy} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyAJG7IjvvALqEglWyxYeeAadbG0yYBDEL0",authDomain:"taqueria-40c71.firebaseapp.com",projectId:"taqueria-40c71",storageBucket:"taqueria-40c71.firebasestorage.app",messagingSenderId:"536022224393",appId:"1:536022224393:web:91c205d366d4060736b2d8",measurementId:"G-X59B32XMQV"};
const db=getFirestore(initializeApp(firebaseConfig));
onSnapshot(query(collection(db,"pedidos"),orderBy("timestamp","desc")),snap=>{document.getElementById('estado').innerHTML='✅ '+snap.size+' pedidos';document.getElementById('estado').style.background="#00c853";let total=0;let html="";snap.forEach(d=>{const p=d.data();if(p.estatus!=="cancelado"){total+=Number(p.total||0);const f=p.timestamp?.toDate?p.timestamp.toDate().toLocaleTimeString():"";html+='<div class="card"><div><b>'+(p.cliente||'')+'</b><br><small>'+f+' - '+(p.folio||'')+'</small></div><div><b>$'+p.total+'</b></div></div>';}});document.getElementById('total').innerText='Total: $'+total.toFixed(2);document.getElementById('lista').innerHTML=html||"Sin ventas";});
</script></body></html>
