<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>La Palma</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f0a06;color:#fff;font-family:Arial;padding:12px}
.top{color:#f5c518;text-align:center;padding:20px 0}
.card{background:#1c130d;border:1px solid #333;border-radius:14px;padding:14px;margin-bottom:10px;display:flex;gap:10px;align-items:center}
.card.ico{font-size:42px;width:60px;height:60px;display:flex;align-items:center;justify-content:center;background:#2a1e12;border-radius:12px}
.card.info{flex:1}
.card.info span{color:#f5c518;font-weight:900}
.ctrl{display:flex;align-items:center;gap:10px}
.ctrl button{width:46px;height:46px;border-radius:50%;border:0;background:#f5c518;font-size:24px;font-weight:900}
.ctrl b{font-size:22px;min-width:20px;text-align:center}
.mode{padding:16px;border:2px solid #333;background:#1c130d;border-radius:12px;margin-bottom:8px;display:flex;justify-content:space-between}
.mode.on{border-color:#f5c518;color:#f5c518;background:#2a1e12}
.in{width:100%;padding:14px;border-radius:10px;border:1px solid #333;background:#1c130d;color:#fff;margin:8px 0}
.btn{width:100%;padding:18px;border-radius:30px;border:0;font-weight:900;font-size:19px}
.btn-y{background:#f5c518;color:#000}.btn-g{background:#25D366;color:#000;margin-top:10px}
.totalBox{background:#1c130d;border:2px solid #f5c518;border-radius:14px;padding:14px;margin-top:14px}
.line{display:flex;justify-content:space-between;margin:4px 0;color:#c9a96a}
.line.total{color:#fff;font-size:22px;font-weight:900;border-top:1px solid #333;padding-top:8px;margin-top:8px}
</style>
</head>
<body>
<div class="top"><h1>TAQUERIA<br>LA PALMA</h1><small>81 2688 2736 • Envío $25</small></div>

<input id="nom" class="in" placeholder="Tu nombre">
<h3 style="color:#f5c518;margin:10px 0">¿Cómo será?</h3>
<div id="m1" class="mode" onclick="setM('Comer aquí')">🍽️ Comer aquí <span>›</span></div>
<div id="m2" class="mode on" onclick="setM('Para llevar')">🥡 Para llevar <span>›</span></div>
<div id="m3" class="mode" onclick="setM('A domicilio')">🛵 A domicilio <span>›</span></div>
<div id="extra"></div>

<h3 style="color:#f5c518;margin:14px 0 8px">Tu pedido</h3>
<div id="lista"></div>

<div class="totalBox">
<div class="line"><span>Comida:</span><span id="sub">$0</span></div>
<div class="line"><span>Envío (<span id="tmod">Para llevar</span>):</span><span id="env">$0</span></div>
<div class="line total"><span>TOTAL:</span><span id="tot">$0 PESOS</span></div>
<button class="btn btn-g" id="wha">ENVIAR WHATSAPP 📲 81 2688 2736</button>
<button class="btn btn-y" style="margin-top:8px" onclick="alert('Pedido listo!')">LISTO ✅</button>
</div>

<script>
let modo='Para llevar',cart={},ENV=25;
const tacos=[
{name:'Orden de tacos',price:60,ico:'🌮'},
{name:'Pirata',price:50,ico:'🥙'},
{name:'Gringa',price:50,ico:'🌯'},
{name:'Campechana',price:50,ico:'🥩'},
{name:'Papa',price:70,ico:'🥔'}
];
function setM(m){
modo=m;
document.querySelectorAll('.mode').forEach(e=>e.classList.remove('on'));
if(m=='Comer aquí'){m1.classList.add('on');extra.innerHTML='<input id="mesa" class="in" placeholder="Mesa">';}
if(m=='Para llevar'){m2.classList.add('on');extra.innerHTML='';}
if(m=='A domicilio'){m3.classList.add('on');extra.innerHTML='<input id="dir" class="in" placeholder="Dirección completa">';}
tmod.innerText=m;
upd();
}
function draw(){
let h='';
tacos.forEach((t,i)=>{
let c=cart[i]||0;
h+=`<div class="card"><div class="ico">${t.ico}</div><div class="info"><b>${t.name}</b><br><span>$${t.price}</span></div><div class="ctrl"><button onclick="ch(${i},-1)">−</button><b>${c}</b><button onclick="ch(${i},1)">+</button></div></div>`;
});
lista.innerHTML=h;
}
function ch(i,d){cart[i]=Math.max(0,(cart[i]||0)+d);if(cart[i]==0)delete cart[i];draw();upd();}
function upd(){
let sub=0;Object.keys(cart).forEach(k=>sub+=cart[k]*tacos[k].price);
let envio = modo=='A domicilio'?ENV:0;
let total = sub+envio;
subEl=document.getElementById('sub');subEl.innerText='$'+sub;
document.getElementById('env').innerText='$'+envio;
document.getElementById('tot').innerText='$'+total+' PESOS';
}
wha.onclick=()=>{
let items=[];let sub=0;
Object.keys(cart).forEach(k=>{if(cart[k]>0){items.push(`${cart[k]}x ${tacos[k].name}`);sub+=cart[k]*tacos[k].price;}});
if(!items.length)return alert('Agrega tacos');
let envio = modo=='A domicilio'?ENV:0;
let total=sub+envio;
let nm=nom.value||'Cliente';
let ex='';
if(modo=='Comer aquí')ex='Mesa:'+(document.getElementById('mesa')?.value||'');
if(modo=='A domicilio')ex='Dir:'+(document.getElementById('dir')?.value||'');
let msg=`*TAQUERIA LA PALMA*%0ACliente:${nm}%0ATipo:${modo}%0A${ex}%0A%0A${items.join('%0A')}%0A%0ASubtotal:$${sub}%0AEnvío:$${envio}%0ATOTAL:$${total} PESOS`;
window.open('https://wa.me/528126882736?text='+msg,'_blank');
};
draw();setM('Para llevar');
</script>
</body>
</html>
