<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Taquería La Palma - Menú</title>
<style>
body{background:#0f0a06;color:#fff;font-family:Arial;margin:0}
.marco{border:14px solid #f5c518; border-image: repeating-linear-gradient(45deg,#f5c518 10px,#111 10px 20px) 20; padding:10px; min-height:100vh; background:rgba(0,0,0,0.92)}
.header{text-align:center;padding:10px}
.header h1{color:#f5c518;margin:5px;font-size:32px}
.modo{display:flex;gap:8px;justify-content:center;margin:10px;flex-wrap:wrap}
.modo button{padding:10px 14px;border-radius:20px;border:2px solid #f5c518;background:#111;color:#fff;font-weight:900}
.modo button.active{background:#f5c518;color:#111}
.card{background:#1c130d;border:2px solid #f5c518;border-radius:16px;display:flex;gap:10px;padding:10px;margin:12px 0;align-items:center}
.card img{width:100px;height:100px;object-fit:cover;border-radius:12px;border:2px solid #f5c518;background:#222}
.info{flex:1}
.precio{color:#25D366;font-weight:900;font-size:18px}
.controls{display:flex;align-items:center;gap:8px;margin-top:6px}
.btn{padding:6px 14px;border-radius:20px;border:0;font-weight:900}
.menos{background:#333;color:#fff}.mas{background:#f5c518;color:#111}
.extra-box{background:#222;border-radius:10px;padding:6px 8px;margin-top:6px;display:flex;justify-content:space-between;align-items:center}
input{width:92%;padding:12px;border-radius:12px;border:2px solid #f5c518;background:#111;color:#fff;margin:6px 0}
.totalBox{position:sticky;bottom:0;background:#111;border-top:3px solid #f5c518;padding:12px;text-align:center;z-index:99}
.btn-whats{background:#25D366;padding:14px 20px;border-radius:30px;font-size:18px;width:100%;margin-top:8px;border:0;font-weight:900}
.btn-atras{background:#444;padding:8px 14px;border-radius:20px;color:#fff;margin:10px;border:0}
</style>
</head>
<body>
<div class="marco">
<div class="header">
  <button class="btn-atras" onclick="history.back()">⬅ Atrás</button>
  <h1>🌮 Taquería La Palma</h1>
</div>
<div class="modo">
  <button id="m1" class="active" onclick="setModo('Comer aquí')">Comer aquí</button>
  <button id="m2" onclick="setModo('Para llevar')">Llevar</button>
  <button id="m3" onclick="setModo('A domicilio')">Domicilio +$25</button>
</div>
<div style="text-align:center">
  <input id="nombre" placeholder="Tu nombre">
  <input id="dir" placeholder="Dirección (solo si es domicilio)" style="display:none">
</div>
<div id="menu"></div>
<div class="totalBox">
  <h2 id="totalTxt">$0 PESOS</h2>
  <button class="btn-whats" onclick="enviar()">LISTO ✅ Mandar a Cocina + WhatsApp</button>
</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const firebaseConfig = {
  apiKey: "AIzaSyAJG7IjvvALqEglWyxYeeAadbG0yYBDEL0",
  authDomain: "taqueria-40c71.firebaseapp.com",
  projectId: "taqueria-40c71",
  storageBucket: "taqueria-40c71.firebasestorage.app",
  messagingSenderId: "536022224393",
  appId: "1:536022224393:web:91c205d366d4060736b2d8"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let modo='Comer aquí'; const ENV=25;
let productos=[
  {id:0, n:'Orden Tacos Bistec (5 pza)', p:65, pe:15, tipo:'taco', img:'https://images.unsplash.com/photo-1504674900247-0877df9cc836?w=200&h=200&fit=crop'},
  {id:1, n:'Orden Tacos Trompo (5 pza)', p:65, pe:15, tipo:'taco', img:'https://images.unsplash.com/photo-1565299624946-b28f40a0ae38?w=200&h=200&fit=crop'},
  {id:2, n:'Orden Tacos Molleja (5 pza)', p:70, pe:16, tipo:'taco', img:'https://images.unsplash.com/photo-1551504734-5ee1c4a1479b?w=200&h=200&fit=crop'},
  {id:3, n:'Hamburguesa Sencilla', p:65, pe:0, tipo:'otro', img:'https://images.unsplash.com/photo-1568909344668-6f14a07b56a0?w=200&h=200&fit=crop'},
  {id:4, n:'Hamburguesa Doble', p:80, pe:0, tipo:'otro', img:'https://images.unsplash.com/photo-1594212699903-ec8a3eca50f5?w=200&h=200&fit=crop'},
  {id:5, n:'Hamburguesa c/ Aros Cebolla', p:100, pe:0, tipo:'otro', img:'https://images.unsplash.com/photo-1571091718767-18b5b1457add?w=200&h=200&fit=crop'},
  {id:6, n:'Papa Bistec', p:60, pe:0, tipo:'otro', img:'https://images.unsplash.com/photo-1573080496219-bb080dd4f877?w=200&h=200&fit=crop'},
  {id:7, n:'Papa Trompo', p:60, pe:0, tipo:'otro', img:'https://images.unsplash.com/photo-1606756790138-261d2b21cd75?w=200&h=200&fit=crop'},
  {id:8, n:'Papa Mixta', p:60, pe:0, tipo:'otro', img:'https://images.unsplash.com/photo-1625937327855-28729e9ae3ce?w=200&h=200&fit=crop'},
  {id:9, n:'Papas Francesa', p:15, pe:0, tipo:'otro', img:'https://images.unsplash.com/photo-1573080496219-bb080dd4f877?w=200&h=200&fit=crop'},
  {id:10, n:'Coca Cola', p:25, pe:0, tipo:'otro', img:'https://images.unsplash.com/photo-1553456558-aff63285bdd1?w=200&h=200&fit=crop'},
  {id:11, n:'Agua Natural', p:25, pe:0, tipo:'otro', img:'https://images.unsplash.com/photo-1548839140-29a749e1cf4d?w=200&h=200&fit=crop'},
];
let cart={}; let extra={};
productos.forEach(p=>{cart[p.id]=0; extra[p.id]=0;});

window.setModo=(m)=>{
  modo=m;
  document.querySelectorAll('.modo button').forEach(b=>b.classList.remove('active'));
  if(m=='Comer aquí') m1.classList.add('active');
  if(m=='Para llevar') m2.classList.add('active');
  if(m=='A domicilio'){ m3.classList.add('active'); dir.style.display='block'; } else { dir.style.display='none'; }
  upd();
}
function render(){
  let h='';
  productos.forEach(p=>{
    h+=`<div class="card">
      <img src="${p.img}">
      <div class="info">
        <b>${p.n}</b><br><span class="precio">$${p.p}</span>
        <div class="controls">
          <button class="btn menos" onclick="ch(${p.id},-1)">-</button>
          <span id="c${p.id}">0 orden</span>
          <button class="btn mas" onclick="ch(${p.id},1)">+</button>
        </div>
        ${p.tipo=='taco'?`<div class="extra-box"><small>Taco extra (+$${p.pe})</small><div><button class="btn menos" onclick="chE(${p.id},-1)">-</button><span id="e${p.id}">0</span><button class="btn mas" onclick="chE(${p.id},1)">+</button></div></div>`:''}
      </div>
    </div>`;
  });
  document.getElementById('menu').innerHTML=h;
}
window.ch=(id,d)=>{
  cart[id]=Math.max(0, Math.min(4, cart[id]+d));
  document.getElementById('c'+id).innerText=cart[id]+' orden'+(cart[id]!=1?'es':'');
  upd();
}
window.chE=(id,d)=>{
  extra[id]=Math.max(0, Math.min(4, extra[id]+d));
  document.getElementById('e'+id).innerText=extra[id];
  upd();
}
window.upd=()=>{
  let s=0;
  productos.forEach(p=>{
    let pe = p.pe || 0;
    s+= cart[p.id]*p.p + extra[p.id]*pe;
  });
  if(modo=='A domicilio' && s>0) s+=ENV;
  document.getElementById('totalTxt').innerText='$'+s+' PESOS';
  return s;
}
window.enviar=async()=>{
  let items=[]; let total=upd();
  if(total==0){alert('Agrega algo'); return;}
  productos.forEach(p=>{
    if(cart[p.id]>0) items.push(cart[p.id]+'x '+p.n);
    if(extra[p.id]>0) items.push(extra[p.id]+'x Taco extra de '+p.n);
  });
  let folio=Date.now().toString().slice(-4);
  let orden={folio, nombre:document.getElementById('nombre').value||'Cliente', modo, direccion:document.getElementById('dir').value||'', items, total, entregado:false, fecha:new Date().toISOString()};
  let ordenes=JSON.parse(localStorage.getItem('ordenes')||'[]'); ordenes.push(orden); localStorage.setItem('ordenes',JSON.stringify(ordenes));
  try{ await addDoc(collection(db,'ordenes'), orden); }catch(e){}
  let msg=`Hola La Palma %0AFOLIO #${folio}%0A${orden.nombre} - ${modo}%0A${items.join('%0A')}%0ATOTAL $${total}`;
  window.open('https://wa.me/5218126882736?text='+msg,'_blank');
}
render(); upd();
</script>
</body>
</html>
