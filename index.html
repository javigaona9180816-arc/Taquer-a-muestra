<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Taquería Javi - Ordene Aquí</title>
<style>
body{background:#0f0a06;color:#fff;font-family:Arial;margin:0}
.marco{border:14px solid #f5c518; border-image: repeating-linear-gradient(45deg,#f5c518 10px,#111 10px 20px) 20; padding:10px; min-height:100vh; background:rgba(0,0,0,0.92)}
.card{background:#1c130d;border:2px solid #f5c518;border-radius:16px;display:flex;gap:10px;padding:10px;margin:12px 0;align-items:center}
.card img{width:100px;height:100px;object-fit:cover;border-radius:12px;border:2px solid #f5c518;background:#222}
.precio{color:#25D366;font-weight:900;font-size:18px}
.btn{padding:6px 14px;border-radius:20px;border:0;font-weight:900}
.menos{background:#333;color:#fff}.mas{background:#f5c518;color:#111}
.extra-box{background:#222;border-radius:10px;padding:6px 8px;margin-top:6px;display:flex;justify-content:space-between;align-items:center}
input,textarea{width:92%;padding:12px;border-radius:12px;border:2px solid #f5c518;background:#111;color:#fff;margin:6px 0;font-family:Arial}
.totalBox{position:sticky;bottom:0;background:#111;border-top:3px solid #f5c518;padding:12px;text-align:center;z-index:99}
.btn-whats{background:#25D366;padding:14px 20px;border-radius:30px;font-size:18px;width:100%;margin-top:8px;border:0;font-weight:900;color:#111}
.btn-atras{background:#444;padding:8px 14px;border-radius:20px;color:#fff;margin:10px;border:0;font-weight:900}
.welcome{min-height:85vh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}
.welcome img{width:95%;max-width:420px;border-radius:20px;border:3px solid #f5c518;box-shadow:0 0 20px rgba(245,197,24,0.4)}
.welcome h2{color:#f5c518;font-size:28px;margin:18px 0 6px;letter-spacing:2px;text-transform:uppercase;text-shadow:2px 2px 0 #000}
.btn-big{width:92%;max-width:340px;padding:16px;border-radius:30px;border:2px solid #f5c518;font-weight:900;font-size:18px;margin:8px;cursor:pointer}
.btn-mostrador{background:#f5c518;color:#111}.btn-domicilio{background:#111;color:#fff}
.ticket{background:#fff;color:#111;border-radius:16px;padding:16px;margin:12px 0;font-family:monospace}
.line{display:flex;justify-content:space-between;margin:4px 0}
.hidden{display:none}
</style>
</head>
<body>
<div class="marco">
<div id="pantalla-bienvenida" class="welcome">
  <img src="TU_LOGO_TAQUERIA_JAVI.jpg" id="logoImg" alt="Taqueria Javi">
  <h2>Bienvenido<br>ordene aquí</h2>
  <p>Elige cómo quieres tu pedido</p>
  <button class="btn-big btn-mostrador" onclick="irMenu('Recoger en mostrador')">🏪 Recoger en mostrador</button>
  <button class="btn-big btn-domicilio" onclick="irMenu('A domicilio')">🛵 A tu domicilio</button>
</div>
<div id="pantalla-menu" class="hidden">
  <div style="text-align:left"><button class="btn-atras" onclick="volverInicio()">⬅ Atrás</button></div>
  <div style="text-align:center"><h1 style="color:#f5c518">🌮 TAQUERIA JAVI</h1><small id="modoLabel" style="color:#f5c518;font-weight:900"></small></div>
  <div id="menu"></div>
  <div class="totalBox"><h2 id="totalTxt">$0 PESOS</h2><button class="btn-whats" id="btnOrdenar" onclick="irTicket()">ORDENAR ➡️</button></div>
</div>
<div id="pantalla-ticket" class="hidden">
  <div style="text-align:left"><button class="btn-atras" onclick="volverMenu()">⬅ Atrás</button></div>
  <div class="ticket" id="ticketDiv"></div>
  <div style="text-align:center">
    <input id="nombre" placeholder="Tu nombre">
    <textarea id="dir" placeholder="Dirección completa (calle, número, colonia, referencias)" rows="3" class="hidden"></textarea>
    <input id="telCliente" placeholder="Tu número WhatsApp (para enviarte copia)" type="tel">
    <p style="font-size:12px;color:#aaa">Tu pedido llegará a cocina y ventas con folio</p>
    <button class="btn-whats" style="font-size:20px;padding:18px" onclick="enviar()">ENVIAR PEDIDO 🚀</button>
    <p id="folioInfo" style="color:#f5c518;margin-top:10px;font-weight:900"></p>
  </div>
</div>
</div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const firebaseConfig = { apiKey: "AIzaSyAJG7IjvvALqEglWyxYeeAadbG0yYBDEL0", authDomain: "taqueria-40c71.firebaseapp.com", projectId: "taqueria-40c71", storageBucket: "taqueria-40c71.firebasestorage.app", messagingSenderId: "536022224393", appId: "1:536022224393:web:91c205d366d4060736b2d8" };
const app = initializeApp(firebaseConfig); const db = getFirestore(app);
let modo='Recoger en mostrador'; const ENV=30;
let productos=[
  {id:0, n:'Orden Tacos Bistec (5 pza)', p:65, pe:15, tipo:'taco', img:'https://images.unsplash.com/photo-1504674900247-0877df9cc836?w=200&h=200&fit=crop'},
  {id:1, n:'Orden Tacos Trompo (5 pza)', p:65, pe:15, tipo:'taco', img:'https://images.unsplash.com/photo-1551504734-5ee1c4a1479b?w=200&h=200&fit=crop'},
  {id:2, n:'Orden Tacos Molleja (5 pza)', p:70, pe:16, tipo:'taco', img:'https://images.unsplash.com/photo-1565299585323-38d6b0865b47?w=200&h=200&fit=crop'},
  {id:3, n:'Hamburguesa Sencilla', p:65, pe:0, tipo:'otro', img:'https://images.unsplash.com/photo-1568909344668-6f14a07b56a0?w=200&h=200&fit=crop'},
  {id:4, n:'Hamburguesa Doble', p:80, pe:0, tipo:'otro', img:'https://images.unsplash.com/photo-1594212699903-ec8a3eca50f5?w=200&h=200&fit=crop'},
  {id:5, n:'Hamburguesa c/ Aros Cebolla', p:100, pe:0, tipo:'otro', img:'https://images.unsplash.com/photo-1571091718767-18b5b1457add?w=200&h=200&fit=crop'},
  {id:6, n:'Papa Bistec', p:60, pe:0, tipo:'otro', img:'https://images.unsplash.com/photo-1573080496219-bb080dd4f877?w=200&h=200&fit=crop'},
  {id:7, n:'Papa Trompo', p:60, pe:0, tipo:'otro', img:'https://images.unsplash.com/photo-1606756790138-261d2b21cd75?w=200&h=200&fit=crop'},
  {id:8, n:'Papa Mixta', p:60, pe:0, tipo:'otro', img:'https://images.unsplash.com/photo-1625937327855-28729e9ae3ce?w=200&h=200&fit=crop'},
  {id:9, n:'Papas Francesa', p:15, pe:0, tipo:'otro', img:'https://images.unsplash.com/photo-1573080496219-bb080dd4f877?w=200&h=200&fit=crop'},
  {id:10, n:'Coca Cola', p:25, pe:0, tipo:'otro', img:'https://images.unsplash.com/photo-1553456558-aff63285bdd1?w=200&h=200&fit=crop'},
  {id:11, n:'Agua Natural', p:25, pe:0, tipo:'otro', img:'https://images.unsplash.com/photo-1548839140-29a749e1cf4d?w=200&h=200&fit=crop'},
];
let cart={}; let extra={}; productos.forEach(p=>{cart[p.id]=0; extra[p.id]=0;});
window.irMenu=(m)=>{ modo=m; document.getElementById('pantalla-bienvenida').classList.add('hidden'); document.getElementById('pantalla-menu').classList.remove('hidden'); document.getElementById('modoLabel').innerText=m.toUpperCase(); render(); }
window.volverInicio=()=>{ document.getElementById('pantalla-menu').classList.add('hidden'); document.getElementById('pantalla-ticket').classList.add('hidden'); document.getElementById('pantalla-bienvenida').classList.remove('hidden'); }
window.volverMenu=()=>{ document.getElementById('pantalla-ticket').classList.add('hidden'); document.getElementById('pantalla-menu').classList.remove('hidden'); }
window.irTicket=()=>{ let t=upd(); if(t==0){alert('Agrega algo'); return;} document.getElementById('pantalla-menu').classList.add('hidden'); document.getElementById('pantalla-ticket').classList.remove('hidden'); let d=document.getElementById('dir'); if(modo=='A domicilio') d.classList.remove('hidden'); else d.classList.add('hidden'); renderTicket(); }
function render(){ let h=''; productos.forEach(p=>{ h+=`<div class="card"><img src="${p.img}"><div style="flex:1"><b>${p.n}</b><br><span class="precio">$${p.p}</span><div style="display:flex;align-items:center;gap:8px;margin-top:6px"><button class="btn menos" onclick="ch(${p.id},-1)">-</button><span id="c${p.id}">0 orden</span><button class="btn mas" onclick="ch(${p.id},1)">+</button></div>${p.tipo=='taco'?`<div class="extra-box"><small>Taco extra (+$${p.pe})</small><div><button class="btn menos" onclick="chE(${p.id},-1)">-</button><span id="e${p.id}">0</span><button class="btn mas" onclick="chE(${p.id},1)">+</button></div></div>`:''}</div></div>`; }); document.getElementById('menu').innerHTML=h; upd(); }
window.ch=(id,d)=>{ cart[id]=Math.max(0,Math.min(4,cart[id]+d)); document.getElementById('c'+id).innerText=cart[id]+' orden'+(cart[id]!=1?'es':''); upd(); }
window.chE=(id,d)=>{ extra[id]=Math.max(0,Math.min(4,extra[id]+d)); document.getElementById('e'+id).innerText=extra[id]; upd(); }
window.upd=()=>{ let s=0; productos.forEach(p=>{ s+=cart[p.id]*p.p + extra[p.id]*p.pe; }); if(modo=='A domicilio'&&s>0) s+=ENV; document.getElementById('totalTxt').innerText='$'+s+' PESOS'; return s; }
function renderTicket(){ let sub=0; productos.forEach(p=>{ sub+=cart[p.id]*p.p + extra[p.id]*p.pe; }); let tot=sub; if(modo=='A domicilio'&&sub>0) tot+=ENV; let folio='JAVI-'+Date.now().toString().slice(-5); document.getElementById('folioInfo').innerText='FOLIO: '+folio; document.getElementById('folioInfo').dataset.folio=folio; let ht=`<h3 style="text-align:center">🌮 TAQUERIA JAVI<br>FOLIO ${folio}</h3><hr>`; productos.forEach(p=>{ if(cart[p.id]>0) ht+=`<div class="line"><span>${cart[p.id]}x ${p.n}</span><span>$${cart[p.id]*p.p}</span></div>`; if(extra[p.id]>0) ht+=`<div class="line"><span>${extra[p.id]}x Extra ${p.n}</span><span>$${extra[p.id]*p.pe}</span></div>`; }); ht+=`<hr><div class="line"><span>Subtotal</span><span>$${sub}</span></div>`; if(modo=='A domicilio') ht+=`<div class="line"><span>Envío</span><span>($30 por el envío)</span></div><div class="line"><span>Envío</span><span>$${ENV}</span></div>`; ht+=`<div class="line" style="font-weight:900;font-size:18px"><span>TOTAL</span><span>$${tot}</span></div>`; document.getElementById('ticketDiv').innerHTML=ht; }
window.enviar=async()=>{ let sub=0; productos.forEach(p=>{ sub+=cart[p.id]*p.p + extra[p.id]*p.pe; }); let tot=sub; if(modo=='A domicilio'&&sub>0) tot+=ENV; if(tot==0){alert('Agrega algo');return;} let nombre=document.getElementById('nombre').value||'Cliente'; let direccion=document.getElementById('dir').value||''; let telCliente=document.getElementById('telCliente').value||''; if(modo=='A domicilio'&&!direccion){alert('Escribe tu dirección');return;} if(!telCliente){alert('Escribe tu número WhatsApp');return;} let folio=document.getElementById('folioInfo').dataset.folio; let items=[]; productos.forEach(p=>{ if(cart[p.id]>0) items.push(cart[p.id]+'x '+p.n); if(extra[p.id]>0) items.push(extra[p.id]+'x Extra '+p.n); }); let orden={folio,nombre,modo,direccion,telefono:telCliente,items,subtotal:sub,envio:modo=='A domicilio'?ENV:0,total:tot,entregado:false,fecha:new Date().toISOString()}; try{ let ords=JSON.parse(localStorage.getItem('ordenes')||'[]'); ords.push(orden); localStorage.setItem('ordenes',JSON.stringify(ords)); }catch(e){} try{ await addDoc(collection(db,'ordenes'),orden); }catch(e){} let msg=`*TAQUERIA JAVI*%0AFOLIO ${folio}%0A${nombre} - ${modo}%0A${items.join('%0A')}%0A%0ASubtotal $${sub}%0A${modo=='A domicilio'?`Envio ($30 por el envio) $${ENV}%0A`:''}TOTAL $${tot}%0A${direccion?`Dir: ${direccion}%0A`:''}Tel: ${telCliente}`; window.open('https://wa.me/5218126882736?text='+msg,'_blank'); setTimeout(()=>{ let tc=telCliente.replace(/[^0-9]/g,''); if(tc.length>=10){ let tw=tc.startsWith('52')?tc:'52'+tc; window.open('https://wa.me/'+tw+'?text='+msg,'_blank'); } },800); alert('Pedido enviado! FOLIO '+folio); }
render();
</script>
</body>
                                 </html>
