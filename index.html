<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>TAQUERIA JAVI</title>
<style>body{font-family:Arial;background:#111;color:#fff;margin:0;padding:12px}h1{text-align:center;color:#ffcc00}.taco{background:#222;padding:12px;border-radius:12px;margin:8px 0;display:flex;justify-content:space-between;align-items:center}button{padding:10px 14px;border:none;border-radius:8px;font-weight:bold;cursor:pointer}.add{background:#ffcc00}.cart{position:sticky;bottom:0;background:#222;padding:12px;border-radius:12px;margin-top:12px}input,select{width:100%;padding:10px;border-radius:8px;border:none;margin:6px 0}</style>
</head><body>
<h1>🌮 TAQUERIA JAVI</h1>
<div id="menu"></div>
<div class="cart">
<input id="nombre" placeholder="Tu nombre">
<select id="modo"><option>Para comer aquí</option><option>Para llevar</option><option>A domicilio (+$25)</option></select>
<div id="resumen"></div>
<button id="pedir" style="width:100%;background:#25D366;color:#fff;margin-top:8px">📲 PEDIR POR WHATSAPP</button>
</div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";
const firebaseConfig = {
  apiKey: "AIzaSyAJG7IjvvALqEglWyxYeeAadbG0yYBDEL0",
  authDomain: "taqueria-40c71.firebaseapp.com",
  projectId: "taqueria-40c71",
  storageBucket: "taqueria-40c71.firebasestorage.app",
  messagingSenderId: "536022224393",
  appId: "1:536022224393:web:91c205d366d4060736b2d8",
  measurementId: "G-X59B32XMQV"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const tacos = {
 pastor:{n:"Pastor",p:40}, bistec:{n:"Bistec",p:45}, chorizo:{n:"Chorizo",p:40}, campechano:{n:"Campechano",p:45}
};
let cart={};
function renderMenu(){
 document.getElementById('menu').innerHTML=Object.keys(tacos).map(k=>`
  <div class="taco"><div><b>${tacos[k].n}</b> - $${tacos[k].p}</div>
  <div><button onclick="changeCart('${k}',-1)">-</button> <span id="c-${k}">0</span> <button class="add" onclick="changeCart('${k}',1)">+</button></div></div>`).join('');
}
window.changeCart=(k,d)=>{cart[k]=(cart[k]||0)+d; if(cart[k]<0)cart[k]=0; document.getElementById('c-'+k).innerText=cart[k]; upd();}
function upd(){
 let items=[],total=0; Object.keys(cart).forEach(k=>{if(cart[k]>0){items.push(cart[k]+'x '+tacos[k].n); total+=cart[k]*tacos[k].p;}});
 let extra=document.getElementById('modo').value.includes('domicilio')?25:0;
 document.getElementById('resumen').innerHTML=items.join('<br>')+ (items.length?`<br><b>Total: $${total+extra}</b>`:'Carrito vacío');
 window._items=items; window._total=total+extra;
}
document.getElementById('modo').addEventListener('change',upd);
document.getElementById('pedir').onclick=async()=>{
 if(!window._items||!window._items.length)return alert('Agrega tacos');
 let nombre=document.getElementById('nombre').value||'Cliente';
 let modo=document.getElementById('modo').value;
 let folio=Math.floor(1000+Math.random()*9000);
 let orden={folio,nombre,modo,items:window._items,total:window._total,entregado:false,fecha:Date.now()};
 // Guardar local
 let ordenes=JSON.parse(localStorage.getItem('ordenes')||'[]'); ordenes.push({...orden,fechaEntrega:null}); localStorage.setItem('ordenes',JSON.stringify(ordenes));
 // Guardar en Firebase
 try{ await addDoc(collection(db,"ordenes"), orden); }catch(e){console.log(e)}
 // WhatsApp - CAMBIA TU NUMERO AQUI
 let txt=`FOLIO #${folio} - ${nombre} - ${modo}%0A${window._items.join('%0A')}%0ATOTAL $${window._total}`;
 window.open(`https://wa.me/528112345678?text=${txt}`,'_blank');
 cart={}; renderMenu(); upd();
};
renderMenu(); upd();
</script></body></html>
