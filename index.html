<!DOCTYPE html>
<html lang="es">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Taqueria La Palma</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}body{font-family:Inter,sans-serif;background:#0f0a06;color:#fff;min-height:100vh}
.screen{display:none;min-height:100vh;padding:18px}.screen.active{display:flex;flex-direction:column}
#portada{background:#0f0a06;justify-content:center;align-items:center;text-align:center}
#portada img{width:94%;max-width:420px;border-radius:12px}
.btn-gold{background:#f5c518;color:#000;border:none;padding:16px 28px;border-radius:30px;font-weight:900;font-size:18px;cursor:pointer;width:100%;max-width:380px;margin-top:24px}
.topbar{display:flex;justify-content:space-between;background:#1c130d;padding:12px;border-radius:12px;border:1px solid #3a2716;margin-bottom:14px}
.topbar small{color:#c9a96a}.topbar b{color:#f5c518}
.input{width:100%;padding:13px;border-radius:10px;border:1px solid #3a2716;background:#1c130d;color:#fff;margin-bottom:10px;font-size:16px}
.mode-btn{padding:18px;border-radius:14px;border:2px solid #3a2716;background:#1c130d;color:#fff;font-weight:700;cursor:pointer;text-align:left;display:flex;justify-content:space-between}
.mode-btn.active{border-color:#f5c518;background:#2a1e12;color:#f5c518}
.item{background:#1c130d;border:1px solid #3a2716;border-radius:14px;padding:14px;display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.item span{color:#f5c518;font-weight:800}
.ctrl button{width:36px;height:36px;border-radius:50%;border:none;background:#f5c518;font-weight:900;cursor:pointer}
#ordenar{width:100%;padding:18px;border:none;border-radius:14px;background:#25D366;font-weight:900;font-size:18px;cursor:pointer}
</style></head>
<body>
<div id="portada" class="screen active">
<img src="logo.jpg"><button class="btn-gold" onclick="go('opciones')">VER MENÚ 🌮</button>
<small style="color:#c9a96a;margin-top:12px">81 2688 2736 • Reparto propio sin Didi</small>
</div>
<div id="opciones" class="screen">
<div class="topbar"><div><small>Folio</small><br><b id="folio"></b></div><div><small>WhatsApp</small><br><b>81 2688 2736</b></div></div>
<input id="nombre" class="input" placeholder="Tu nombre">
<h2 style="color:#f5c518;margin:10px 0">¿Cómo será tu orden?</h2>
<button class="mode-btn" id="m1" onclick="setMode('Comer aquí')">🍽️ Comer aquí <span>›</span></button>
<button class="mode-btn" id="m2" onclick="setMode('Para llevar')">🥡 Para llevar <span>›</span></button>
<button class="mode-btn" id="m3" onclick="setMode('A domicilio')">🛵 A domicilio (propio) <span>›</span></button>
<div id="extra" style="margin-top:12px"></div>
<button class="btn-gold" onclick="go('menu')">CONTINUAR →</button>
</div>
<div id="menu" class="screen">
<div class="topbar"><div><small id="tipoShow"></small><br><b id="nombreShow"></b></div><div><b id="folio2"></b></div></div>
<div id="menuList"></div>
<div style="margin-top:auto">Total: $<span id="total">0</span><br><br><button id="ordenar">ENVIAR A WHATSAPP 81 2688 2736 📲</button></div>
</div>
<script>
let folio='LP-'+Math.floor(1000+Math.random()*9000);document.getElementById('folio').innerText=folio;document.getElementById('folio2').innerText=folio;
let modo='Para llevar';let carrito={};const tacos=[{name:'Orden de tacos',price:60},{name:'Pirata',price:50},{name:'Gringa',price:50},{name:'Campechana',price:50},{name:'Papa',price:70}];
function go(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active');if(id==='menu')render();}
function setMode(m){modo=m;document.querySelectorAll('.mode-btn').forEach(b=>b.classList.remove('active'));if(m==='Comer aquí'){m1.classList.add('active');extra.innerHTML='<input id="mesa" class="input" placeholder="No. Mesa">'}if(m==='Para llevar'){m2.classList.add('active');extra.innerHTML='Recoge en mostrador'}if(m==='A domicilio'){m3.classList.add('active');extra.innerHTML='<input id="dir" class="input" placeholder="Dirección completa"><input id="envio" class="input" placeholder="Costo envío (opcional)">'}tipoShow.innerText=m;}
function render(){nombreShow.innerText=document.getElementById('nombre').value||'Invitado';let h='';tacos.forEach((t,i)=>{let c=carrito[i]||0;h+=`<div class="item"><div>${i+1}. ${t.name} <span>$${t.price}</span></div><div><button onclick="ch(${i},-1)">-</button> ${c} <button onclick="ch(${i},1)">+</button></div></div>`});menuList.innerHTML=h;let tot=0;Object.keys(carrito).forEach(k=>tot+=carrito[k]*tacos[k].price);total.innerText=tot;}
function ch(i,d){carrito[i]=Math.max(0,(carrito[i]||0)+d);if(carrito[i]==0)delete carrito[i];render();}
ordenar.onclick=()=>{let lines=[],tot=0;Object.keys(carrito).forEach(k=>{if(carrito[k]>0){lines.push(`${carrito[k]}x ${tacos[k].name}`);tot+=carrito[k]*tacos[k].price}});if(!lines.length)return alert('Agrega algo');let nom=nombre.value||'Cliente';let ex='';if(modo==='Comer aquí')ex=`Mesa: ${document.getElementById('mesa')?.value}`;if(modo==='A domicilio')ex=`Dirección: ${document.getElementById('dir')?.value} Envío: ${document.getElementById('envio')?.value}`;let msg=`*LA PALMA*%0AFolio:${folio}%0ACliente:${nom}%0ATipo:${modo}%0A${ex}%0A%0A${lines.join('%0A')}%0ATotal:$${tot}`;window.open(`https://wa.me/528126882736?text=${msg}`,'_blank');}
setMode('Para llevar');
</script></body></html>
