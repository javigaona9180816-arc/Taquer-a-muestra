<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Taquería La Palma - Menú</title>
<style>
body{
  background: #0f0a06 url('https://www.transparenttextures.com/patterns/wood-pattern.png');
  color:#fff; font-family:Arial, sans-serif; margin:0; padding:0;
}
.marco{
  border: 14px solid #f5c518;
  border-image: repeating-linear-gradient(45deg, #f5c518, #f5c518 10px, #111 10px, #111 20px) 20;
  padding:10px; min-height:100vh;
  background: rgba(0,0,0,0.85);
}
.header{text-align:center; padding:10px}
.header h1{color:#f5c518; margin:5px; font-size:32px; text-shadow:2px 2px 0 #000}
.modo{display:flex; gap:8px; justify-content:center; margin:10px}
.modo button{padding:10px 16px; border-radius:20px; border:2px solid #f5c518; background:#111; color:#fff; font-weight:900}
.modo button.active{background:#f5c518; color:#111}
.card{
  background:#1c130d; border:2px solid #f5c518; border-radius:16px;
  display:flex; gap:10px; padding:10px; margin:10px 0; align-items:center;
}
.card img{width:95px; height:95px; object-fit:cover; border-radius:12px; border:2px solid #f5c518}
.info{flex:1}
.precio{color:#25D366; font-weight:900}
.controls{display:flex; align-items:center; gap:6px; margin-top:6px; flex-wrap:wrap}
.btn{padding:6px 12px; border-radius:20px; border:0; font-weight:900}
.menos{background:#333; color:#fff}.mas{background:#f5c518; color:#111}
.extra-box{background:#222; border-radius:10px; padding:6px; margin-top:6px; display:flex; justify-content:space-between; align-items:center}
input{width:90%; padding:10px; border-radius:10px; border:2px solid #f5c518; background:#111; color:#fff; margin:8px 0}
.totalBox{position:sticky; bottom:0; background:#111; border-top:3px solid #f5c518; padding:12px; text-align:center}
.btn-whats{background:#25D366; padding:14px 20px; border-radius:30px; font-size:18px; width:100%; margin-top:8px}
.btn-atras{background:#444; padding:8px 14px; border-radius:20px; color:#fff; margin:10px}
</style>
</head>
<body>
<div class="marco">
<div class="header">
  <button class="btn-atras" onclick="history.back()">⬅ Atrás</button>
  <h1>🌮 Taquería La Palma</h1>
  <p>Escobedo, N.L. - Pedidos en línea</p>
</div>

<div class="modo">
  <button id="m1" class="active" onclick="setModo('Comer aquí')">Comer aquí</button>
  <button id="m2" onclick="setModo('Para llevar')">Llevar</button>
  <button id="m3" onclick="setModo('A domicilio')">Domicilio +$25</button>
</div>

<div style="text-align:center">
  <input id="nombre" placeholder="Tu nombre">
  <input id="dir" placeholder="Dirección (solo si es domicilio)" style="display:none">
</div>

<div id="menu"></div>

<div class="totalBox">
  <h2 id="totalTxt">$0 PESOS</h2>
  <button class="btn btn-whats" onclick="enviar()">LISTO ✅ Mandar a Cocina + WhatsApp</button>
</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const firebaseConfig = {
  apiKey: "AIzaSyAJG7IjvvALqEglWyxYeeAadbG0yYBDEL0",
  authDomain: "taqueria-40c71.firebaseapp.com",
  projectId: "taqueria-40c71",
  storageBucket: "taqueria-40c71.firebasestorage.app",
  messagingSenderId: "536022224393",
  appId: "1:536022224393:web:91c205d366d4060736b2d8"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let modo='Comer aquí'; const ENV=25;
let productos=[
  {id:0, n:'Orden Tacos Bistec (5 pza)', p:65, pe:15, tipo:'taco', img:'bistec.jpg'},
  {id:1, n:'Orden Tacos Trompo (5 pza)', p:65, pe:15, tipo:'taco', img:'trompo.jpg'},
  {id:2, n:'Orden Tacos Molleja (5 pza)', p:70, pe:16, tipo:'taco', img:'molleja.jpg'},
  {id:3, n:'Hamburguesa Sencilla', p:65, tipo:'otro', img:'hamburguesa.jpg'},
  {id:4, n:'Hamburguesa Doble', p:80, tipo:'otro', img:'hamburguesa.jpg'},
  {id:5, n:'Hamburguesa c/ Aros Cebolla', p:100, tipo:'otro', img:'hamburguesa.jpg'},
  {id:6, n:'Papa Bistec', p:60, tipo:'otro', img:'papa.jpg'},
  {id:7, n:'Papa Trompo', p:60, tipo:'otro', img:'papa.jpg'},
  {id:8, n:'Papa Mixta', p:60, tipo:'otro', img:'papa.jpg'},
  {id:9, n:'Papas Francesa', p:15, tipo:'otro', img:'papas.jpg'},
  {id:10, n:'Coca Cola', p:25, tipo:'otro', img:'coca.jpg'},
  {id:11, n:'Agua', p:25, tipo:'otro', img:'agua.jpg'},
];
let cart={}; let extra={};
productos.forEach(p=>{cart[p.id]=0; extra[p.id]=0});

window.setModo=(m)=>{
  modo=m;
  document.querySelectorAll('.modo button').forEach(b=>b.classList.remove('active'));
  if(m=='Comer aquí') m1.classList.add('active');
  if(m=='Para llevar') m2.classList.add('active');
  if(m=='A domicilio'){ m3.classList.add('active'); dir.style.display='block'; } else { dir.style.display='none'; }
  upd();
}
function render(){
  let h='';
  productos.forEach(p=>{
    h+=`<div class="card">
      <img src="${p.img}" onerror="this.src='https://via.placeholder.com/95?text=La+Palma'">
      <div class="info">
        <b>${p.n}</b><br><span class="precio">$${p.p}</span><br>
        <div class="controls">
          <button class="btn menos" onclick="ch(${p.id},-1)">-</button>
          <span id="c${p.id}">0 orden</span>
          <button class="btn mas" onclick="ch(${p.id},1)">+</button>
        </div>
        ${p.tipo=='taco'?`
        <div class="extra-box">
          <small>Taco extra (+$${p.pe})</small>
          <div>
            <button class="btn menos" onclick="chE(${p.id},-1)">-</button>
            <span id="e${p.id}">${extra[p.id]}</span>
            <button class="btn mas" onclick="chE(${p.id},1)">+</button>
          </div>
        </div>`:''}
      </div>
    </div>`;
  });
  document.getElementById('menu').innerHTML=h;
}
window.ch=(id,d)=>{
  cart[id]=Math.max(0, Math.min(4, cart[id]+d));
  document.getElementById('c'+id).innerText=cart[id]+' orden'+(cart[id]!=1?'es':'');
  upd();
}
window.chE=(id,d)=>{
  extra[id]=Math.max(0, Math.min(4, extra[id]+d));
  document.getElementById('e'+id).innerText=extra[id];
  upd();
}
window.upd=()=>{
  let s=0;
  productos.forEach(p=>{
    s+=cart[p.id]*p.p + extra[p.id]*p.pe;
  });
  if(modo=='A domicilio') s+= (s>0?ENV:0);
  document.getElementById('totalTxt').innerText='$'+s+' PESOS';
  return s;
}
window.enviar=async()=>{
  let items=[]; let total=upd();
  if(total==0){alert('Agrega algo'); return;}
  productos.forEach(p=>{
    if(cart[p.id]>0) items.push(cart[p.id]+'x '+p.n);
    if(extra[p.id]>0) items.push(extra[p.id]+'x Taco extra de '+p.n);
  });
  let folio=Date.now().toString().slice(-4);
  let orden={folio, nombre:document.getElementById('nombre').value||'Cliente', modo, direccion:document.getElementById('dir').value||'', items, total, entregado:false, fecha:new Date().toISOString()};
  // guardar local
  let ordenes=JSON.parse(localStorage.getItem('ordenes')||'[]'); ordenes.push(orden); localStorage.setItem('ordenes',JSON.stringify(ordenes));
  // guardar Firebase
  try{ await addDoc(collection(db,'ordenes'), orden); }catch(e){ console.log(e); }
  // whatsapp
  let msg=`Hola La Palma 🌮%0AFOLIO #${folio}%0A${orden.nombre} - ${modo}%0A${items.join('%0A')}%0ATOTAL $${total}`;
  window.open('https://wa.me/5218130000000?text='+msg,'_blank');
}
render(); upd();
</script>
</body>
</html>
