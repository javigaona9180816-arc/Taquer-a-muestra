<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Taqueria La Palma</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f0a06;color:#fff;font-family:Arial;min-height:100vh;padding-bottom:120px}
.screen{display:none;min-height:100vh;padding:16px}.screen.active{display:flex;flex-direction:column}
#portada{justify-content:center;align-items:center;text-align:center;background:radial-gradient(circle,#2a1e12 0%,#0f0a06 75%)}
.wood{background:linear-gradient(180deg,#a87a44,#6b3e1f);border:4px solid #3a1f0e;border-radius:12px;padding:20px 16px;max-width:380px;width:95%}
.wood h1{font-size:40px;line-height:.9;color:#ffe9b5;text-shadow:3px 3px 0 #3a1f0e;font-weight:900}
.btn{background:#f5c518;color:#000;border:none;padding:18px;border-radius:30px;font-weight:900;font-size:19px;width:100%;max-width:380px;margin-top:20px}
.topbar{display:flex;justify-content:space-between;background:#1c130d;padding:12px;border-radius:12px;border:1px solid #3a2716;margin-bottom:12px}
.input{width:100%;padding:14px;border-radius:10px;background:#1c130d;border:1px solid #3a2716;color:#fff;margin-bottom:10px;font-size:16px}
.mode{padding:18px;border:2px solid #3a2716;background:#1c130d;border-radius:14px;margin-bottom:10px;display:flex;justify-content:space-between;cursor:pointer;font-size:17px}
.mode.active{border-color:#f5c518;background:#2a1e12;color:#f5c518}
.item{background:#1c130d;border:1px solid #3a2716;border-radius:14px;padding:12px;display:flex;gap:12px;align-items:center;margin-bottom:10px}
.item img{width:64px;height:64px;border-radius:12px;object-fit:cover;background:#2a1e12}
.item-info{flex:1}
.item-info b{font-size:16px}.item-info span{color:#f5c518;font-weight:800;display:block;margin-top:2px}
.ctrl{display:flex;align-items:center;gap:8px}
.ctrl button{width:44px;height:44px;border-radius:50%;border:none;background:#f5c518;font-weight:900;font-size:22px}
.ctrl span{font-size:20px;font-weight:800;min-width:24px;text-align:center}
.footer-total{position:fixed;bottom:0;left:0;right:0;background:#1c130d;border-top:2px solid #f5c518;padding:14px 16px;z-index:10}
#ord{width:100%;padding:16px;background:#25D366;border:none;border-radius:12px;font-weight:900;font-size:18px;margin-top:8px}
.cost-line{display:flex;justify-content:space-between;margin:4px 0;font-size:15px;color:#c9a96a}
.cost-line.total{font-size:18px;color:#fff;font-weight:900;border-top:1px solid #3a2716;padding-top:6px;margin-top:6px}
</style>
</head>
<body>
<div id="p1" class="screen active">
<div style="font-size:32px">🌶️🍋🌴</div>
<div class="wood"><h1>TAQUERIA<br>LA PALMA</h1></div>
<button class="btn" onclick="go('p2')">VER MENÚ 🌮</button>
<small style="color:#c9a96a;margin-top:10px">81 2688 2736 • Reparto propio $25</small>
</div>

<div id="p2" class="screen">
<div class="topbar"><b id="f1"></b><b>81 2688 2736</b></div>
<input id="nom" class="input" placeholder="Tu nombre">
<h2 style="color:#f5c518;margin:12px 0">¿Cómo será tu orden?</h2>
<div class="mode" id="ma" onclick="sm('Comer aquí')">🍽️ Comer aquí <span>›</span></div>
<div class="mode" id="mb" onclick="sm('Para llevar')">🥡 Para llevar <span>›</span></div>
<div class="mode" id="mc" onclick="sm('A domicilio')">🛵 A domicilio (propio $25) <span>›</span></div>
<div id="ex" style="margin-top:10px"></div>
<div id="resumenOpc" style="margin-top:12px;background:#1c130d;border:1px solid #3a2716;border-radius:12px;padding:12px;display:none"></div>
<button class="btn" onclick="go('p3')">CONTINUAR →</button>
</div>

<div id="p3" class="screen">
<div class="topbar"><small id="tshow"></small><b id="f2"></b></div>
<div id="mlist"></div>
</div>

<div class="footer-total" id="foot" style="display:none">
<div id="costBreak"></div>
<button id="ord">ENVIAR A WHATSAPP 📲 81 2688 2736</button>
</div>

<script>
let folio='LP-'+Math.floor(1000+Math.random()*9000);f1.innerText=folio;f2.innerText=folio;
let modo='Para llevar',cart={};
const tacos=[
{name:'Orden de tacos',price:60,img:'🌮'},
{name:'Pirata',price:50,img:'🥙'},
{name:'Gringa',price:50,img:'🌯'},
{name:'Campechana',price:50,img:'🥩'},
{name:'Papa',price:70,img:'🥔'}
];
const envioCosto=25;

function go(id){
document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
document.getElementById(id).classList.add('active');
foot.style.display = id==='p3'? 'block' : 'none';
if(id==='p3')rend();
}
function sm(m){
modo=m;
document.querySelectorAll('.mode').forEach(b=>b.classList.remove('active'));
let extraHTML='';
if(m==='Comer aquí'){ma.classList.add('active');extraHTML='<input id="mesa" class="input" placeholder="No. de Mesa">';}
if(m==='Para llevar'){mb.classList.add('active');extraHTML='<small style="color:#aaa">Recoges en mostrador, sin costo extra</small>';}
if(m==='A domicilio'){mc.classList.add('active');extraHTML='<input id="dir" class="input" placeholder="Calle, colonia, referencia"><small style="color:#f5c518">Costo de envío: $25</small>';}
ex.innerHTML=extraHTML;
tshow.innerText=m;
// mostrar resumen abajo en esta misma pantalla
let resumen=`<div class="cost-line"><span>Tipo:</span><b>${m}</b></div>`;
if(m==='A domicilio') resumen+=`<div class="cost-line"><span>Envío:</span><b>$${envioCosto}</b></div>`;
else resumen+=`<div class="cost-line"><span>Envío:</span><b>$0</b></div>`;
resumenOpc.innerHTML=resumen;
resumenOpc.style.display='block';
}
function rend(){
let h='';
tacos.forEach((t,i)=>{
let c=cart[i]||0;
h+=`<div class="item">
<div style="font-size:48px;width:64px;height:64px;display:flex;align-items:center;justify-content:center;background:#2a1e12;border-radius:12px">${t.img}</div>
<div class="item-info"><b>${i+1}. ${t.name}</b><span>$${t.price}</span></div>
<div class="ctrl"><button onclick="ch(${i},-1)">−</button><span>${c}</span><button onclick="ch(${i},1)">+</button></div>
</div>`;
});
mlist.innerHTML=h;
updateCosts();
}
function ch(i,d){cart[i]=Math.max(0,(cart[i]||0)+d);if(cart[i]==0)delete cart[i];rend();}

function updateCosts(){
let subtotal=0;
Object.keys(cart).forEach(k=>{subtotal+=cart[k]*tacos[k].price;});
let envio = (modo==='A domicilio')? envioCosto : 0;
let total = subtotal + envio;
let html='';
html+=`<div class="cost-line"><span>Subtotal comida:</span><span>$${subtotal}</span></div>`;
html+=`<div class="cost-line"><span>Envío (${modo}):</span><span>$${envio}</span></div>`;
html+=`<div class="cost-line total"><span>TOTAL A PAGAR:</span><span>$${total}</span></div>`;
costBreak.innerHTML=html;
}

ord.onclick=()=>{
let lines=[],sub=0;
Object.keys(cart).forEach(k=>{if(cart[k]>0){lines.push(`${cart[k]}x ${tacos[k].name} $${tacos[k].price}`);sub+=cart[k]*tacos[k].price;}});
if(!lines.length)return alert('Agrega algo de tu menú');
let env = (modo==='A domicilio')?envioCosto:0;
let total=sub+env;
let nm=document.getElementById('nom').value||'Cliente';
let extra='';
if(modo==='Comer aquí') extra=`Mesa: ${document.getElementById('mesa')?.value||''}`;
if(modo==='A domicilio') extra=`Dir: ${document.getElementById('dir')?.value||''}`;
let msg=`*TAQUERIA LA PALMA*%0AFolio:${folio}%0ACliente:${nm}%0ATipo:${modo}%0A${extra}%0A%0A${lines.join('%0A')}%0A%0ASubtotal:$${sub}%0AEnvío:$${env}%0A*Total:$${total}*`;
window.open(`https://wa.me/528126882736?text=${msg}`,'_blank');
};

sm('Para llevar');
go('p1');
</script>
</body>
</html>
