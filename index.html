<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Taqueria</title>
<style>body{font-family:system-ui;background:#0f0f0f;color:#fff;padding:12px}.card{background:#1e1e1e;border-radius:12px;padding:12px;margin:10px 0}.btn{padding:12px;border:none;border-radius:10px;font-weight:bold;width:100%;margin:4px 0}.btn-gold{background:#ffcc00;color:#000}.btn-dark{background:#333;color:#fff}.menu{display:grid;grid-template-columns:1fr 1fr;gap:10px}.item{background:#222;padding:10px;border-radius:10px;text-align:center} input,select{width:100%;padding:10px;border-radius:8px;border:none;margin:6px 0;background:#222;color:#fff}</style>
</head><body>
<h1 style="color:#ffcc00">Taqueria - Pedido</h1>
<div id="estado" style="background:#333;padding:8px;border-radius:8px">Conectando...</div>
<div class="card"><div id="menu" class="menu"></div></div>
<div class="card"><h3>Datos</h3><div id="totales">Vacio</div>
<input id="nombre" placeholder="Nombre"><input id="whats" placeholder="WhatsApp"><select id="tipo"><option value="">Tipo</option><option value="Mesa">Mesa</option><option value="Para llevar">Para llevar</option><option value="Domicilio">Domicilio +$30</option></select>
<button class="btn btn-gold" onclick="irConfirmar()">Siguiente</button></div>
<div id="vistaConfirm" style="display:none" class="card"><h2>Confirma</h2><p><b id="cNombre"></b> - <b id="cFolio"></b></p><div id="cDetalle"></div><div id="cTotal"></div><button class="btn btn-gold" onclick="enviar()">Enviar pedido</button><button class="btn btn-dark" onclick="volver()">Volver</button></div>
<div id="vistaGracias" style="display:none" class="card"><h2 style="color:#00e676">Enviado!</h2><p id="msgGracias"></p><button class="btn btn-dark" onclick="location.reload()">Otro</button></div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getFirestore,collection,addDoc,serverTimestamp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const firebaseConfig = {
  apiKey: "AIzaSyAJG7IjvvALqEglWyxYeeAadbG0yYBDEL0",
  authDomain: "taqueria-40c71.firebaseapp.com",
  projectId: "taqueria-40c71",
  storageBucket: "taqueria-40c71.firebasestorage.app",
  messagingSenderId: "536022224393",
  appId: "1:536022224393:web:91c205d366d4060736b2d8",
  measurementId: "G-X59B32XMQV"
};
const db=getFirestore(initializeApp(firebaseConfig));
document.getElementById('estado').innerHTML="✅ Conectado taqueria-40c71"; document.getElementById('estado').style.background="#00c853";
const productos=[{n:"Taco Suelto",p:20},{n:"Quesadilla",p:35},{n:"Torta",p:60},{n:"Gringa",p:55},{n:"Volcan",p:30},{n:"Refresco",p:25}];
let carrito={}; let tipo=null;
function renderMenu(){const m=document.getElementById('menu'); m.innerHTML=""; productos.forEach((prod,i)=>{const cant=carrito[i]||0; m.innerHTML+='<div class="item"><b>'+prod.n+'</b><br>$'+prod.p+'<br><button class="btn btn-dark" onclick="cambiar('+i+',1)">+</button> '+cant+' <button class="btn btn-dark" onclick="cambiar('+i+',-1)">-</button></div>';});}
window.cambiar=(i,d)=>{carrito[i]=(carrito[i]||0)+d; if(carrito[i]<=0) delete carrito[i]; renderMenu(); renderTot();};
function getTot(){let sub=0,txt=""; Object.keys(carrito).forEach(i=>{sub+=carrito[i]*productos[i].p; txt+=carrito[i]+'x '+productos[i].n+'<br>';}); let envio=tipo==="Domicilio"?30:0; return {sub,envio,total:sub+envio,txt};}
function renderTot(){const t=getTot(); document.getElementById('totales').innerHTML=t.txt?t.txt+'<b>Total $'+t.total+'</b>':'Vacio';}
document.getElementById('tipo').addEventListener('change',e=>{tipo=e.target.value; renderTot();});
let folioData=(()=>{const hoy=new Date().toLocaleDateString(); let num=parseInt(localStorage.getItem('folio_'+hoy)||"0")+1; return {hoy,num};})();
window.irConfirmar=()=>{const nom=document.getElementById('nombre').value.trim(); const whats=document.getElementById('whats').value.trim(); if(!nom||!whats) return alert("Falta nombre/whatsapp"); if(!Object.keys(carrito).length) return alert("Carrito vacio"); if(!tipo) return alert("Falta tipo"); const tot=getTot(); document.getElementById('cNombre').innerText=nom; document.getElementById('cFolio').innerText=folioData.hoy+'-'+folioData.num; document.getElementById('cDetalle').innerHTML=tot.txt; document.getElementById('cTotal').innerText='Total $'+tot.total; document.getElementById('vistaConfirm').style.display='block';};
window.volver=()=>{document.getElementById('vistaConfirm').style.display='none';};
window.enviar=async()=>{const tot=getTot(); const nom=document.getElementById('nombre').value; const whats=document.getElementById('whats').value; const items=Object.keys(carrito).map(i=>({nombre:productos[i].n,precio:productos[i].p,cantidad:carrito[i]})); try{await addDoc(collection(db,"pedidos"),{cliente:nom,whatsapp:whats,tipo,items,subtotal:tot.sub,envio:tot.envio,total:tot.total,estatus:"pendiente",folio:folioData.hoy+'-'+folioData.num,timestamp:serverTimestamp()}); localStorage.setItem('folio_'+folioData.hoy,folioData.num); document.getElementById('vistaConfirm').style.display='none'; document.getElementById('vistaGracias').style.display='block'; document.getElementById('msgGracias').innerText='Folio '+folioData.hoy+'-'+folioData.num+' Total $'+tot.total;}catch(e){alert(e.message);}};
renderMenu();
</script></body></html>
