<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Taqueria La Palma</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f0a06;color:#fff;font-family:Arial;min-height:100vh}
.screen{display:none;min-height:100vh;padding:16px}.screen.active{display:flex;flex-direction:column}
#portada{justify-content:center;align-items:center;text-align:center;background:radial-gradient(circle at center,#2a1e12 0%,#0f0a06 70%)}
.wood{background:linear-gradient(#8B5A2B,#5D3310);border:4px solid #3a1f0e;border-radius:8px;padding:20px 14px;max-width:380px;width:95%;box-shadow:0 10px 30px #000;transform:rotate(-1deg)}
.wood h1{font-size:42px;line-height:0.9;color:#f5d6a0;text-shadow:2px 2px 0 #3a1f0e;font-weight:900;letter-spacing:1px}
.wood h1 span{display:block;font-size:48px}
.decor{font-size:28px;margin-bottom:6px}
.btn{background:#f5c518;color:#000;border:none;padding:16px 28px;border-radius:30px;font-weight:900;font-size:18px;width:100%;max-width:380px;margin-top:24px}
.topbar{display:flex;justify-content:space-between;background:#1c130d;padding:12px;border-radius:12px;border:1px solid #333;margin-bottom:12px}
.input{width:100%;padding:13px;border-radius:10px;background:#1c130d;border:1px solid #333;color:#fff;margin-bottom:10px}
.mode{padding:16px;border:2px solid #333;background:#1c130d;border-radius:12px;margin-bottom:10px;display:flex;justify-content:space-between;cursor:pointer}
.mode.active{border-color:#f5c518;background:#2a1e12;color:#f5c518}
.item{background:#1c130d;border:1px solid #333;border-radius:12px;padding:12px;display:flex;justify-content:space-between;margin-bottom:8px}
#ord{width:100%;padding:18px;background:#25D366;border:none;border-radius:12px;font-weight:900;font-size:18px;margin-top:12px}
</style>
</head>
<body>
<div id="p1" class="screen active">
<div class="decor">🌶️🍋🌴🌿</div>
<div class="wood"><h1>TAQUERIA<span>LA PALMA</span></h1></div>
<small style="color:#c9a96a;margin-top:14px;display:block">MENÚ ORIGINAL</small>
<button class="btn" onclick="go('p2')">VER MENÚ 🌮</button>
<small style="color:#aaa;margin-top:12px">81 2688 2736 • Reparto propio sin Didi</small>
</div>

<div id="p2" class="screen">
<div class="topbar"><b id="f1"></b><b>81 2688 2736</b></div>
<input id="nom" class="input" placeholder="Tu nombre">
<h2 style="color:#f5c518;margin:10px 0">¿Cómo será tu orden?</h2>
<div class="mode" id="ma" onclick="sm('Comer aquí')">🍽️ Comer aquí <span>›</span></div>
<div class="mode" id="mb" onclick="sm('Para llevar')">🥡 Para llevar <span>
