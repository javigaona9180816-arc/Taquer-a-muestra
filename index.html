<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>La Palma</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}body{background:#0f0a06;color:#fff;font-family:Arial;min-height:100vh}
.screen{display:none;min-height:100vh;padding:16px}.screen.active{display:flex;flex-direction:column}
#portada{justify-content:center;align-items:center;text-align:center;background:radial-gradient(circle,#2a1e12 0%,#0f0a06 75%)}
.wood{background:linear-gradient(180deg,#a87a44,#6b3e1f);border:4px solid #3a1f0e;border-radius:12px;padding:22px 16px;max-width:380px;width:95%;box-shadow:0 12px 30px #000}
.wood h1{font-size:44px;line-height:.9;color:#ffe9b5;text-shadow:3px 3px 0 #3a1f0e;font-weight:900}
.btn{background:#f5c518;color:#000;border:none;padding:16px;border-radius:30px;font-weight:900;font-size:18px;width:100%;max-width:380px;margin-top:22px}
.topbar{display:flex;justify-content:space-between;background:#1c130d;padding:12px;border-radius:12px;border:1px solid #333;margin-bottom:12px}
.input{width:100%;padding:13px;border-radius:10px;background:#1c130d;border:1px solid #333;color:#fff;margin-bottom:10px}
.mode{padding:16px;border:2px solid #333;background:#1c130d;border-radius:12px;margin-bottom:10px;display:flex;justify-content:space-between;cursor:pointer}
.mode.active{border-color:#f5c518;background:#2a1e12;color:#f5c518}
.item{background:#1c130d;border:1px solid #333;border-radius:12px;padding:12px;display:flex;justify-content:space-between;margin-bottom:8px}
#ord{width:100%;padding:18px;background:#25D366;border:none;border-radius:12px;font-weight:900;font-size:18px;margin-top:12px}
</style>
</head>
<body>
<div id="p1" class="screen active">
<div style="font-size:30px">🌶️🍋🌴🌿</div>
<div class="wood"><h1>TAQUERIA<br>LA PALMA</h1></div>
<button class="btn" onclick="go('p2')">VER MENÚ 🌮</button>
<small style="color:#c9a96a;margin-top:12px">81 2688 2736 • Reparto propio sin Didi</small>
</div>
<div id="p2" class="screen">
<div class="topbar"><b id="f1"></b><b>81 2688 2736</b></div>
<input id="nom" class="input" placeholder="Tu nombre">
<h2 style="color:#f5c518;margin:10px 0">¿Cómo será tu orden?</h2>
<div class="mode" id="ma" onclick="sm('Comer aquí')">🍽️ Comer aquí <span>›</span></div>
<div class="mode" id="mb" onclick="sm('Para llevar')">🥡 Para llevar <span>›</span></div>
<div class="mode" id="mc" onclick="sm('A domicilio')">🛵 A domicilio (propio) <span>›</span></div>
<div id="ex" style="margin-top:10px"></div>
<button class="btn" onclick="go('p3')">CONTINUAR →</button>
</div>
<div id="p3" class="screen">
<div class="topbar"><small id="tshow"></small><b id="f2"></b></div>
<div id="mlist"></div>
<div style="margin-top:auto">Total $<span id="tot">0</span><br><br><button id="ord">ENVIAR A WHATSAPP 📲</button></div>
</div>
<script>
let folio='LP-'+Math.floor(1000+Math.random()*9000);f1.innerText=folio;f2.innerText=folio;
let modo='Para llevar',cart={};const tacos=[{name:'Orden de tacos',price:60},{name:'Pirata',price:50},{name:'Gringa',price:50},{name:'Campechana',price:50},{name:'Papa',price:70}];
function go(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active');if(id==='p3')rend();}
function sm(m){modo=m;document.querySelectorAll('.mode').forEach(b=>b.classList.remove('active'));if(m==='Comer aquí'){ma.classList.add('active');ex.innerHTML='<input id="mesa" class="input" placeholder="Mesa">'}if(m==='Para llevar'){mb.classList.add('active');ex.innerHTML='<small>Recoge en mostrador</small>'}if(m==='A domicilio'){mc.classList.add('active');ex.innerHTML='<input id="dir" class="input" placeholder="Dirección"><input id="env" class="input" placeholder="Envío opcional">'}tshow.innerText=m;}
function rend(){let h='';tacos.forEach((t,i)=>{let c=cart[i]||0;h+=`<div class="item"><div>${t.name} <span style="color:#f5c518">$${t.price}</span></div><div><button onclick="ch(${i},-1)" style="width:32px;height:32px;border-radius:50%;border:none;background:#f5c518">-</button> ${c} <button onclick="ch(${i},1)" style="width:32px;height:32px;border-radius:50%;border:none;background:#f5c518">+</button></div></div>`});mlist.innerHTML=h;let tt=0;Object.keys(cart).forEach(k=>tt+=cart[k]*tacos[k].price);tot.innerText=tt;}
function ch(i,d){cart[i]=Math.max(0,(cart[i]||0)+d);if(cart[i]==0)delete cart[i];rend();}
ord.onclick=()=>{let ls=[],tt=0;Object.keys(cart).forEach(k=>{if(cart[k]>0){ls.push(cart[k]+'x '+tacos[k].name);tt+=cart[k]*tacos[k].price}});if(!ls.length)return alert('Agrega algo');let nm=nom.value||'Cliente';let extra='';if(modo==='Comer aquí')extra='Mesa:'+(document.getElementById('mesa')?.value||'');if(modo==='A domicilio')extra='Dir:'+(document.getElementById('dir')?.value||'');let msg=`*LA PALMA*%0AFolio:${folio}%0ACliente:${nm}%0ATipo:${modo}%0A${extra}%0A${ls.join('%0A')}%0ATotal:$${tt}`;window.open(`https://wa.me/528126882736?text=${msg}`,'_blank');}
sm('Para llevar');
</script>
</body>
</html>
