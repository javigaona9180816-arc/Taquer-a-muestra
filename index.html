<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Taquería Javi</title>
<style>
*{box-sizing:border-box;font-family:system-ui}body{margin:0;background:#0f0f0f;color:#fff;padding:12px}
.card{background:#1c1c1c;border-radius:16px;padding:14px;margin-bottom:12px}
.btn{width:100%;padding:16px;border-radius:12px;border:0;font-weight:800;font-size:18px;cursor:pointer}
.btn-gold{background:#ffb703;color:#000}.btn-dark{background:#2a2a2a;color:#fff;border:1px solid #444}
.top{display:flex;gap:8px;justify-content:space-between}.folio{background:#000;padding:6px 10px;border-radius:8px;font-family:monospace}
.prod{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #333}
input,textarea{width:100%;padding:12px;border-radius:10px;border:1px solid #333;background:#111;color:#fff;margin-top:6px}
small{color:#aaa}
#vistaConfirm{display:none}
</style>
</head>
<body>

<!-- VISTA 1: BIENVENIDA + MENU -->
<div id="vistaMenu">
  <div class="card" style="text-align:center">
    <h1 style="margin:0">Bienvenido a<br>Taquería Javi 🌮</h1>
    <p>¿Cómo te lo preparamos?</p>
    <div class="top">
      <button class="btn btn-gold" onclick="setTipo('mostrador')">🏪 Recoger en Mostrador</button>
      <button class="btn btn-dark" onclick="setTipo('domicilio')">🛵 A Domicilio (+$25)</button>
    </div>
    <small id="tipoSel" style="display:block;margin-top:8px;color:#ffb703"></small>
  </div>

  <div class="card top">
    <div style="flex:1">Nombre del cliente<br><input id="nombre" placeholder="Ej: Javi"></div>
    <div>Folio<br><div class="folio" id="folio">000</div></div>
  </div>

  <div class="card" id="menu"></div>

  <div class="card">
    <b>Tu Nota:</b><div id="notaPreview" style="margin:8px 0;color:#ccc">Vacía</div>
    <textarea id="notaCliente" placeholder="ejemplo doble salsita, cebolla aparte"></textarea>
    <small>Si no escribes nada, no aparece en cocina</small>
    <hr style="border:0;border-top:1px solid #333;margin:12px 0">
    <div id="totales"></div>
    <button class="btn btn-gold" style="margin-top:12px" onclick="irConfirmar()">ORDENAR →</button>
  </div>
</div>

<!-- VISTA 2: CONFIRMAR -->
<div id="vistaConfirm">
  <div class="card">
    <button class="btn btn-dark" style="width:auto;padding:8px 12px" onclick="volver()">← Atrás</button>
    <h2 style="font-size:28px">Confirma tu pedido</h2>
    <p><b>Cliente:</b> <span id="cNombre"></span><br>
       <b>Folio:</b> <span id="cFolio"></span><br>
       <b>Tipo:</b> <span id="cTipo"></span></p>
    <div id="cDetalle" style="background:#111;padding:12px;border-radius:10px"></div>
    <div id="cTotal" style="margin-top:10px;font-size:22px;font-weight:800"></div>
    <div id="cNota" style="margin-top:8px;color:#ffb703"></div>
    
    <div style="margin-top:20px">
      <label>Tu WhatsApp</label>
      <input id="whats" type="tel" placeholder="811 234 5678">
      <small>La copia de tu pedido te la enviamos por WhatsApp</small>
      <button class="btn btn-gold" style="margin-top:12px" onclick="enviarACocina()">ENVIAR A COCINA 🔥</button>
    </div>
  </div>
</div>
