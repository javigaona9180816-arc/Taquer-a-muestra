<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>La Palma</title><style>body{background:#0f0a06;color:#fff;font-family:Arial;padding:12px}.c{background:#1c130d;border:1px solid #333;border-radius:12px;padding:12px;margin:8px 0;display:flex;gap:10px;align-items:center}.b{width:44px;height:44px;border-radius:50%;border:0;background:#f5c518;font-size:22px;font-weight:900}.m{padding:14px;border:2px solid #333;background:#1c130d;border-radius:12px;margin:6px 0}.m.on{border-color:#f5c518;color:#f5c518}.box{border:2px solid #f5c518;border-radius:12px;padding:12px;background:#1c130d;margin-top:12px}.l{display:flex;justify-content:space-between;margin:4px 0}.t{font-size:22px;font-weight:900;border-top:1px solid #333;padding-top:6px}.btn{width:100%;padding:16px;border-radius:30px;border:0;font-weight:900;font-size:18px;margin-top:8px}.g{background:#25D366}.y{background:#f5c518}</style></head><body>
<h2 style="color:#f5c518;text-align:center">TAQUERIA LA PALMA<br><small style="color:#aaa">81 2688 2736 • Envío $25</small></h2>
<input id="nom" style="width:100%;padding:12px;border-radius:10px;background:#1c130d;border:1px solid #333;color:#fff;margin:8px 0" placeholder="Tu nombre">
<div id="m1" class="m" onclick="setM('Comer aquí')">🍽️ Comer aquí</div>
<div id="m2" class="m on" onclick="setM('Para llevar')">🥡 Para llevar</div>
<div id="m3" class="m" onclick="setM('A domicilio')">🛵 A domicilio ($25)</div>
<div id="ex"></div><div id="lista"></div>
<div class="box"><div class="l"><span>Comida:</span><span id="sub">$0</span></div><div class="l"><span>Envío:</span><span id="env">$0</span></div><div class="l t"><span>TOTAL:</span><span id="tot">$0 PESOS</span></div><button class="btn g" id="wha">ENVIAR WHATSAPP 📲</button><button class="btn y">LISTO ✅</button></div>
<script>
let modo='Para llevar',cart={},ENV=25;let tacos=[{n:'Orden tacos',p:60,i:'🌮'},{n:'Pirata',p:50,i:'🥙'},{n:'Gringa',p:50,i:'🌯'},{n:'Campechana',p:50,i:'🥩'},{n:'Papa',p:70,i:'🥔'}];
function setM(m){modo=m;document.querySelectorAll('.m').forEach(e=>e.classList.remove('on'));if(m=='Comer aquí'){m1.classList.add('on');ex.innerHTML='<input id="mesa" style=\"width:100%;padding:12px;border-radius:10px;background:#1c130d;border:1px solid #333;color:#fff\" placeholder=\"Mesa\">';}if(m=='Para llevar'){m2.classList.add('on');ex.innerHTML='';}if(m=='A domicilio'){m3.classList.add('on');ex.innerHTML='<input id=\"dir\" style=\"width:100%;padding:12px;border-radius:10px;background:#1c130d;border:1px solid #333;color:#fff\" placeholder=\"Dirección\">';}upd();}
function draw(){let h='';tacos.forEach((t,i)=>{let c=cart[i]||0;h+=`<div class="c"><div style="font-size:38px">${t.i}</div><div style="flex:1"><b>${t.n}</b><br><span style="color:#f5c518">$${t.p}</span></div><div style="display:flex;gap:8px;align-items:center"><button class="b" onclick="ch(${i},-1)">−</button><b>${c}</b><button class="b" onclick="ch(${i},1)">+</button></div></div>`});lista.innerHTML=h;}
function ch(i,d){cart[i]=Math.max(0,(cart[i]||0)+d);if(cart[i]==0)delete cart[i];draw();upd();}
function upd(){let s=0;Object.keys(cart).forEach(k=>s+=cart[k]*tacos[k].p);let e=modo=='A domicilio'?ENV:0;sub.innerText='$'+s;env.innerText='$'+e;tot.innerText='$'+(s+e)+' PESOS';}
wha.onclick=()=>{let it=[],s=0;Object.keys(cart).forEach(k=>{if(cart[k]>0){it.push(`${cart[k]}x ${tacos[k].n}`);s+=cart[k]*tacos[k].p;}});if(!it.length)return alert('Agrega');let e=modo=='A domicilio'?ENV:0;let msg=`*LA PALMA*%0A${nom.value||'Cliente'}%0A${modo}%0A${it.join('%0A')}%0ATOTAL:$${s+e}`;window.open('https://wa.me/528126882736?text='+msg,'_blank');};
draw();upd();
</script></body></html>
