<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>COCINA</title>
<style>body{background:#111;color:#fff;font-family:Arial;padding:12px}h1{color:#ffcc00;text-align:center}.orden{background:#222;border-left:5px solid #ffcc00;border-radius:10px;padding:12px;margin:10px 0}.orden.entregado{opacity:.4;border-color:#25D366}button{width:100%;padding:12px;border:none;border-radius:8px;background:#25D366;color:#fff;font-weight:bold;margin-top:8px}</style></head><body>
<h1>🍳 COCINA - JAVI</h1><div id="lista">Conectando...</div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import { getFirestore, collection, onSnapshot, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";
const firebaseConfig = { apiKey: "AIzaSyAJG7IjvvALqEglWyxYeeAadbG0yYBDEL0", authDomain: "taqueria-40c71.firebaseapp.com", projectId: "taqueria-40c71", storageBucket: "taqueria-40c71.firebasestorage.app", messagingSenderId: "536022224393", appId: "1:536022224393:web:91c205d366d4060736b2d8", measurementId: "G-X59B32XMQV" };
const app = initializeApp(firebaseConfig); const db = getFirestore(app);
const lista=document.getElementById('lista');
onSnapshot(collection(db,"ordenes"),(snap)=>{
 let html=''; let ordenes=[]; snap.forEach(d=>ordenes.push({id:d.id,...d.data()}));
 ordenes.sort((a,b)=>b.fecha-a.fecha);
 ordenes.forEach(o=>{
   html+=`<div class="orden ${o.entregado?'entregado':''}"><b>#${o.folio} ${o.nombre} - ${o.modo}</b><br><small>${new Date(o.fecha).toLocaleTimeString()}</small><br><br>${o.items.join('<br>')}<br><br><b>$${o.total}</b>${!o.entregado?`<button onclick="entregar('${o.id}')">✅ ENTREGADO</button>`:'<br><small>ENTREGADO</small>'}</div>`;
 });
 lista.innerHTML=html||'Sin pedidos';
});
window.entregar=async(id)=>{ await updateDoc(doc(db,"ordenes",id),{entregado:true,fechaEntrega:Date.now()}); }
</script></body></html>
