<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cocina</title><style>body{font-family:system-ui;background:#111;color:#fff;padding:12px}.card{background:#222;border-radius:12px;padding:12px;margin:12px 0;border-left:6px solid #ffcc00}.card.preparando{border-left-color:#ff9800}.card.entregado{opacity:.45;border-left-color:#00e676}button{padding:10px;border:none;border-radius:8px;font-weight:bold;margin:4px}.btn-prep{background:#ff9800}.btn-ent{background:#00e676;color:#000}</style></head><body><h1>🔥 COCINA</h1><div id="estado" style="background:#333;padding:10px;border-radius:8px">Conectando...</div><div id="pedidos"></div><script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getFirestore,collection,onSnapshot,query,orderBy,doc,updateDoc} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyAJG7IjvvALqEglWyxYeeAadbG0yYBDEL0",authDomain:"taqueria-40c71.firebaseapp.com",projectId:"taqueria-40c71",storageBucket:"taqueria-40c71.firebasestorage.app",messagingSenderId:"536022224393",appId:"1:536022224393:web:91c205d366d4060736b2d8",measurementId:"G-X59B32XMQV"};
const db=getFirestore(initializeApp(firebaseConfig));
onSnapshot(query(collection(db,"pedidos"),orderBy("timestamp","desc")),(snap)=>{document.getElementById('estado').innerHTML='✅ Conectado - '+snap.size+' pedidos';document.getElementById('estado').style.background="#00c853";const cont=document.getElementById('pedidos');cont.innerHTML="";if(snap.empty){cont.innerHTML="<p>Sin pedidos. Haz uno desde cliente</p>";return;}snap.forEach(d=>{const p=d.data();const id=d.id;const fecha=p.timestamp?.toDate?p.timestamp.toDate().toLocaleString():"ahora";const items=(p.items||[]).map(i=> (i.cantidad||1)+'x '+i.nombre ).join("<br>");cont.innerHTML+='<div class="card '+(p.estatus||'pendiente')+'"><small>'+fecha+' | '+(p.folio||'')+' | <b>'+(p.estatus||'')+'</b></small><h3>'+(p.cliente||'')+' - '+(p.tipo||'')+'</h3><div>'+items+'</div><p><b>Total $'+(p.total||0)+'</b></p><button class="btn-prep" onclick="upd(&quot;'+id+'&quot;,&quot;preparando&quot;)">Preparando</button><button class="btn-ent" onclick="upd(&quot;'+id+'&quot;,&quot;entregado&quot;)">Entregado</button></div>';});},e=>{document.getElementById('estado').innerHTML="❌ "+e.message;});
window.upd=async(id,est)=>{await updateDoc(doc(db,"pedidos",id),{estatus:est});};
</script></body></html>
