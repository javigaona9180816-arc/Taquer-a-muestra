<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>La Palma</title><style>body{background:#111;color:#e6c88a;font-family:serif;margin:0;padding:20px}.card{background:#1e1e1e;padding:12px;margin:10px 0;border-radius:12px;display:flex;justify-content:space-between}button{background:#d4af37;border:0;padding:8px 12px;border-radius:20px;font-weight:700}#car{position:fixed;bottom:10px;left:5%;right:5%;background:#222;border:2px solid #d4af37;padding:15px;border-radius:15px}</style></head><body><h1 style="text-align:center;color:#d4af37">TAQUERIA LA PALMA</h1><div class="card">Orden de tacos $60 <button onclick="add('Orden',60)">+</button></div><div class="card">Pirata $50 <button onclick="add('Pirata',50)">+</button></div><div class="card">Gringa $50 <button onclick="add('Gringa',50)">+</button></div><div class="card">Campechana $50 <button onclick="add('Campechana',50)">+</button></div><div class="card">Papa $70 <button onclick="add('Papa',70)">+</button></div><div id="car"><b>¡A la orden!</b><div id="lista"></div><div id="tot">Total $0</div><button onclick="wa()" style="width:100%;margin-top:10px;background:#d4af37;padding:12px;border-radius:10px;font-weight:bold">ORDENAR</button></div><script>let c={},t=0;function add(n,p){c[n]=(c[n]||0)+1;t+=p;let h='';for(k in c)h+=c[k]+'x '+k+'<br>';document.getElementById('lista').innerHTML=h;document.getElementById('tot').innerText='Total $'+t}function wa(){let m='Hola quiero:%0A';for(k in c)m+=c[k]+'x '+k+'%0A';m+='Total $'+t;open('https://wa.me/5218123456789?text='+m)}</script></body></html>
